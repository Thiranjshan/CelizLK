name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=critical
        continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:migrator-${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: celiz-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy commit through Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          parameters="$(jq -nc \
            --arg instance "$EC2_INSTANCE_ID" \
            --arg command "sudo /usr/local/sbin/celiz-deploy $IMAGE_TAG" \
            '{InstanceIds:[$instance],DocumentName:"AWS-RunShellScript",Parameters:{commands:[$command]},TimeoutSeconds:600,Comment:("Celiz deploy " + $command)}')"
          command_id="$(aws ssm send-command --cli-input-json "$parameters" --query 'Command.CommandId' --output text)"
          echo "SSM command: $command_id"

          for attempt in $(seq 1 120); do
            if status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null)"; then
              case "$status" in
                Success)
                  aws ssm get-command-invocation \
                    --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
                    --query StandardOutputContent --output text
                  exit 0
                  ;;
                Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|Cancelling)
                  aws ssm get-command-invocation \
                    --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
                    --query '[StandardOutputContent,StandardErrorContent]' --output text
                  exit 1
                  ;;
              esac
            fi
            sleep 5
          done

          echo "Timed out waiting for the EC2 deployment command." >&2
          exit 1
